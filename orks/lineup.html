<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../src/video/core.js"></script>
<script src="../src/video/chars.js"></script>
<script src="../src/video/world.js"></script>
<script src="orkrig.js"></script>
<script>
(async () => {
  await document.fonts.load('700 40px "Oswald"', 'Яя');
  const ctx = document.getElementById('c').getContext('2d');
  ctx.fillStyle = '#d8c8a0'; ctx.fillRect(0, 0, 1920, 1080); ctx.fillStyle = '#a89870'; ctx.fillRect(0, 980, 1920, 100);
  const t = 1.3;
  const cell = (i, f) => { const cx = (i % 4) * 480, cy = Math.floor(i / 4) * 540; ctx.save(); ctx.beginPath(); ctx.rect(cx, cy, 480, 540); ctx.clip(); ctx.fillStyle = i % 2 ? '#d8c8a0' : '#cfbe94'; ctx.fillRect(cx, cy, 480, 540); f(cx + 240, cy + 520); ctx.restore(); };
  cell(0, (x, y) => grot(ctx, x, y, 1.2, { time: t, expr: 'happy' }, {}));
  cell(1, (x, y) => orkX(ctx, x - 40, y, 0.8, { time: t, expr: 'angry' }, { weapon: 'choppa' }));
  cell(2, (x, y) => orkX(ctx, x - 60, y, 0.8, { time: t, expr: 'roar', fire: 1 }, { weapon: 'shoota', scars: true }));
  cell(3, (x, y) => orkX(ctx, x - 40, y, 0.8, { time: t, expr: 'talk', armR: -0.6 }, { weapon: 'big', armour: 'eavy', pad: true, checks: true, scars: true, helm: 'horns', bulk: 0.5 }, OKP.nob));
  cell(4, (x, y) => orkX(ctx, x, y, 0.72, { time: t, expr: 'happy' }, { weapon: 'kustom', armour: 'eavy', pad: true, checks: true, scars: true, helm: 'iron', bulk: 1, teethNeck: true, klaw: true, pole: 1, jaw: 'iron' }, OKP.boss));
  cell(5, (x, y) => megaBoss(ctx, x, y, 0.55, { time: t, expr: 'roar', klaw: 0.7 }, { pole: 2, helm: 'horns' }));
  cell(6, (x, y) => megaBoss(ctx, x, y, 0.55, { time: t, expr: 'angry', klaw: 0.2 }, { pole: 2, helm: 'none', plate: true, jaw: 'iron', cape: true }, OKP.prophet));
  cell(7, (x, y) => { grot(ctx, x - 100, y, 1.0, { time: t, expr: 'talk' }, { pole: 1 }); orkX(ctx, x + 60, y, 0.7, { time: t, expr: 'sad', armR: -2.4, armL: 2.4 }, { weapon: 'none' }, OKP.red); });
  window.__ready = true;
})();
</script>
</body></html>
